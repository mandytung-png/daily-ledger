<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日常帳本 Preview</title>
<style>
:root{--bg:#0b0f0d;--panel:#151a17;--panel2:#1d231f;--line:#303832;--text:#f5f7f6;--muted:#9da69f;--green:#8ad7b0;--green2:#1d4634;--danger:#ef8e8e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.top{padding:26px 18px 8px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:14px;align-items:center}.logo{width:64px;height:64px;border-radius:20px;background:var(--green);color:#173426;display:grid;place-items:center;font-size:36px;font-weight:700}.title{font-size:34px;font-weight:900;letter-spacing:-1px}.sub{font-size:16px;color:var(--muted);margin-top:4px}.topbtn{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:18px;padding:13px 17px;font-size:16px}.month{display:flex;justify-content:space-between;align-items:center;padding:18px}.month button{background:transparent;border:0;color:var(--text);font-size:28px}.month strong{font-size:21px}.content{padding:0 18px}.view{display:none}.view.active{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px}.hero{background:var(--green2);border-color:#28553f}.eyebrow{color:var(--muted);font-size:14px}.big{font-size:38px;font-weight:900;margin:5px 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--panel2);border-radius:17px;padding:14px}.stat b{display:block;font-size:20px;margin-top:5px}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section h2,.section>span{font-size:21px;margin:0;font-weight:900}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.left{display:flex;align-items:center;gap:12px}.ico{width:44px;height:44px;border-radius:14px;background:#222a25;display:grid;place-items:center;font-size:21px}.name{font-weight:800}.small{font-size:13px;color:var(--muted);margin-top:3px}.money{font-weight:800;white-space:nowrap}.progress{height:7px;background:#303832;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--green);border-radius:99px}.btn{border:0;border-radius:16px;padding:12px 16px;font-weight:800}.primary{background:var(--green);color:#173426}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.danger{color:var(--danger)}.full{width:100%}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:72px;background:rgba(13,17,15,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 10px calc(7px + env(safe-area-inset-bottom));z-index:5}.nav{border:0;background:transparent;color:var(--muted);font-size:12px;padding:5px}.nav.active{color:var(--green);font-weight:800}.nav .sym{display:block;font-size:21px;margin-bottom:2px}.fab{position:fixed;bottom:54px;left:50%;transform:translate(-50%,50%);width:70px;height:70px;border-radius:50%;border:0;background:var(--green);color:#173426;font-size:42px;font-weight:400;z-index:8;box-shadow:0 8px 24px rgba(0,0,0,.35)}.calendar{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px}.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow div{text-align:center;color:var(--muted);font-size:12px;padding:4px}.day{min-height:72px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:7px;font-size:13px}.day.blank{border-color:transparent;background:transparent}.day.today{border-color:var(--green)}.daynum{font-size:14px;font-weight:800}.dayspend{font-size:11px;color:var(--green);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reportbars{height:175px;display:flex;align-items:end;gap:8px;padding:12px 2px}.reportbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:5px}.reportbar i{width:100%;max-width:28px;background:var(--green);border-radius:6px 6px 2px 2px}.reportbar span{font-size:9px;color:var(--muted)}.setting{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}.setting:last-child{border:0}.pill{padding:5px 9px;border-radius:99px;background:var(--panel2);font-size:11px;color:var(--muted);white-space:nowrap}.tag{padding:5px 8px;border-radius:99px;font-size:10px}.taggreen{background:#173a2b;color:var(--green)}.info{background:#15271f}.warn{background:#2a2619}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#171c19;border-radius:26px 26px 0 0;border:1px solid var(--line);padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:760px;margin:auto;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 18px}.close{float:right;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;width:36px;height:36px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select{width:100%;background:#0e1210;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px;font-size:16px}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}.listitem{cursor:pointer}.empty{text-align:center;padding:28px;color:var(--muted)}.toast{position:fixed;bottom:88px;left:50%;transform:translate(-50%,15px);background:#222a25;color:#fff;padding:10px 14px;border-radius:11px;opacity:0;pointer-events:none;transition:.2s;z-index:100;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:520px){.title{font-size:29px}.logo{width:58px;height:58px}.stats{grid-template-columns:1fr}.big{font-size:34px}.day{min-height:62px}.calendar{padding:10px}.fab{width:64px;height:64px;font-size:38px}}

.authGate{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.authCard{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:28px;text-align:center}
.authCard .logo{margin:0 auto 16px}.authCard h1{margin:0 0 8px}.authCard p{color:var(--muted);line-height:1.6}.authCard .googlebtn{margin-top:18px;width:100%;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fff;color:#222;font-weight:800}
.authUser{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.syncStatus{font-size:12px;color:var(--muted);margin-top:6px}.syncButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
</style></head><body>
<div id="authGate" class="authGate">
  <div class="authCard">
    <div class="logo">$</div>
    <h1>日常帳本</h1>
    <p>登入你的 Google 帳號後，只會開啟你自己的帳本。<br>資料可同步至 Google Sheet，換手機後重新登入即可恢復。</p>
    <button class="googlebtn" onclick="beginGoogleLogin()">使用 Google 登入</button>
    <div id="authMsg" class="small" style="margin-top:12px"></div>
  </div>
</div>
<div class="app">
<header class="top"><div class="brand"><div class="logo">$</div><div><div class="title">日常帳本</div><div class="sub">你的個人帳本 · 2026 年 10 月開始</div></div></div><button class="topbtn" onclick="openSettings()">設定</button></header>
<div class="month"><button onclick="moveMonth(-1)">‹</button><strong id="monthTitle"></strong><button onclick="moveMonth(1)">›</button></div>
<main class="content">
<section id="budget" class="view active"></section><section id="overview" class="view"></section><section id="calendar" class="view"></section><section id="reports" class="view"></section><section id="settings" class="view"></section>
</main><button class="fab" onclick="openAdd()">＋</button></div>
<nav class="bottom"><button class="nav" data-view="calendar" onclick="showView('calendar')"><span class="sym">□</span>日曆</button><button class="nav" data-view="budget" onclick="showView('budget')"><span class="sym">▣</span>預算</button><button class="nav" data-view="overview" onclick="showView('overview')"><span class="sym">☰</span>縱覽</button><button class="nav" data-view="reports" onclick="showView('reports')"><span class="sym">◒</span>報表</button></nav>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div><div id="toast" class="toast"></div>
<script>
const KEY='bookkeeping_production_preview_v5';
const defaultCats=[{id:'rent',name:'房租',emoji:'🏠',type:'fixed',budget:6800},{id:'practice',name:'練球',emoji:'🎾',type:'fixed',budget:2000},{id:'play',name:'打球',emoji:'🏸',type:'fixed',budget:2000},{id:'transport',name:'交通',emoji:'🚌',type:'fixed',budget:800},{id:'phone',name:'手機',emoji:'📱',type:'fixed',budget:520},{id:'food',name:'餐費',emoji:'🍱',type:'variable',budget:7000},{id:'grocery',name:'食材',emoji:'🥬',type:'variable',budget:1000},{id:'life',name:'生活雜支',emoji:'📦',type:'variable',budget:2000}];
const paymentDefaults=[{id:'cash',name:'現金',emoji:'💵'},{id:'bank',name:'銀行卡',emoji:'🏦'},{id:'credit',name:'信用卡',emoji:'💳',type:'credit'}];
const demo={month:'2026-10',income:60000,savingRate:.25,categories:defaultCats,payments:paymentDefaults,monthlyBudgets:{'2026-10':{income:60000,savingRate:.25,budgets:{}}},transactions:[{id:1,date:'2026-10-01',cat:'rent',amount:6800,payment:'bank',note:'房租'},{id:2,date:'2026-10-02',cat:'food',amount:180,payment:'cash',note:'晚餐'},{id:3,date:'2026-10-03',cat:'grocery',amount:680,payment:'bank',note:'超市'},{id:4,date:'2026-10-04',cat:'play',amount:300,payment:'credit',note:'球場'},{id:5,date:'2026-10-05',cat:'food',amount:220,payment:'cash',note:'午餐'},{id:6,date:'2026-10-06',cat:'phone',amount:520,payment:'credit',note:'手機費'}]};
let db=null; let month='2026-10'; let currentEmail=''; let accessToken=''; let tokenClient=null; let gapiReady=false;
const CONFIG={
  CLIENT_ID:'328370861733-v4lhkplb0njodim5j0et7ie4diiscokr.apps.googleusercontent.com',
  SPREADSHEET_ID:'1PJ27PntAv76AJz2NONeKNLZMBcMK_UihGEqJBVJWHko',
  ALLOWED_EMAILS:['mandytung980916@gmail.com','benny91295@gmail.com'],
  SHEET_PREFIX:'帳本_'
};
function freshDb(){return {month:'2026-10',income:60000,savingRate:.25,categories:defaultCats.map(x=>({...x,active:true})),payments:paymentDefaults.map(x=>({...x})),monthlyBudgets:{'2026-10':{income:60000,savingRate:.25,budgets:Object.fromEntries(defaultCats.map(x=>[x.id,x.budget]))}},transactions:[]};}
function storageKey(){return KEY+'_'+currentEmail.toLowerCase();}
function loadLocal(){db=JSON.parse(localStorage.getItem(storageKey())||'null')||freshDb();db.categories=(db.categories||[]).map(x=>({...x,active:x.active!==false}));db.monthlyBudgets=db.monthlyBudgets||{};month=db.month||'2026-10';ensureMonth(month);}
function save(){if(!db)return;db.month=month;localStorage.setItem(storageKey(),JSON.stringify(db));}

const money=n=>'NT$ '+Math.round(n||0).toLocaleString('zh-TW');const monthName=m=>{let[y,mo]=m.split('-');return `${y} 年 ${Number(mo)} 月`};const nextMonth=m=>{let[y,mo]=m.split('-').map(Number);mo++;if(mo===13){y++;mo=1}return y+'-'+String(mo).padStart(2,'0')};

async function waitForGapi(){
  if(gapiReady)return;
  await new Promise((resolve,reject)=>{
    const t=setInterval(()=>{if(window.gapi&&gapi.load){clearInterval(t);gapi.load('client',async()=>{try{await gapi.client.init({discoveryDocs:['https://sheets.googleapis.com/$discovery/rest?version=v4']});gapiReady=true;resolve()}catch(e){reject(e)}})}},100);
    setTimeout(()=>{clearInterval(t);reject(new Error('Google API 載入逾時'))},15000);
  });
}
function beginGoogleLogin(){
  if(CONFIG.CLIENT_ID.startsWith('YOUR_')){document.getElementById('authMsg').textContent='請先在設定檔填入 Google OAuth Client ID。';return;}
  if(!window.google?.accounts?.oauth2){document.getElementById('authMsg').textContent='Google 登入元件尚未載入，請稍後再試。';return;}
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CONFIG.CLIENT_ID,
    scope:'openid email https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/spreadsheets',
    callback:async(resp)=>{if(resp.error){document.getElementById('authMsg').textContent='Google 登入未完成。';return;}accessToken=resp.access_token;try{await waitForGapi();gapi.client.setToken({access_token:accessToken});const u=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+accessToken}}).then(r=>r.json());currentEmail=(u.email||'').toLowerCase();if(!CONFIG.ALLOWED_EMAILS.map(x=>x.toLowerCase()).includes(currentEmail)){document.getElementById('authMsg').textContent='這個 Google 帳號未被允許使用此 App。';google.accounts.oauth2.revoke(accessToken,()=>{});accessToken='';return;}localStorage.setItem('bookkeeping_google_email',currentEmail);loadLocal();document.getElementById('authGate').style.display='none';document.getElementById('signedEmail').textContent=currentEmail;setSyncStatus('已登入，尚未同步');showView('calendar');}catch(e){document.getElementById('authMsg').textContent='登入後初始化失敗：'+e.message;}},
  error_callback:(e)=>{document.getElementById('authMsg').textContent='Google 登入失敗。';}
  });
  tokenClient.requestAccessToken({prompt:'consent'});
}
function signOutApp(){
  if(accessToken&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(accessToken,()=>{});
  accessToken='';currentEmail='';db=null;document.getElementById('authGate').style.display='flex';document.getElementById('authMsg').textContent='已登出。';
}
function setSyncStatus(t){const e=document.getElementById('syncStatus');if(e)e.textContent=t;}
function userSheetName(){return CONFIG.SHEET_PREFIX+(currentEmail.includes('mandy')?'Mandy':'Benny')+'_2026-10起';}
async function ensureSheetTab(){
  const meta=await gapi.client.sheets.spreadsheets.get({spreadsheetId:CONFIG.SPREADSHEET_ID});
  const existing=(meta.result.sheets||[]).map(s=>s.properties.title);
  const title=userSheetName();
  if(!existing.includes(title)){
    await gapi.client.sheets.spreadsheets.batchUpdate({spreadsheetId:CONFIG.SPREADSHEET_ID,resource:{requests:[{addSheet:{properties:{title}}}]}});
  }
  return title;
}
function serializeRows(){
  const rows=[['record_type','id','date','amount','category','payment','note','payload_json','updated_at']];
  (db.transactions||[]).forEach(x=>rows.push(['TRANSACTION',String(x.id),x.date,String(x.amount),x.cat,x.payment,x.note||'', '', new Date().toISOString()]));
  rows.push(['STATE','settings','','','','','',JSON.stringify({month:db.month,income:db.income,savingRate:db.savingRate,categories:db.categories,payments:db.payments,monthlyBudgets:db.monthlyBudgets}),new Date().toISOString()]);
  return rows;
}
async function syncToSheet(){
  if(!currentEmail||!accessToken){toast('請先登入 Google');return;}
  try{setSyncStatus('同步中…');const title=await ensureSheetTab();const rows=serializeRows();await gapi.client.sheets.spreadsheets.values.clear({spreadsheetId:CONFIG.SPREADSHEET_ID,range:`'${title}'!A:I`});await gapi.client.sheets.spreadsheets.values.update({spreadsheetId:CONFIG.SPREADSHEET_ID,range:`'${title}'!A1:I${rows.length}`,valueInputOption:'RAW',resource:{values:rows}});setSyncStatus('最後同步：'+new Date().toLocaleString('zh-TW'));toast('已同步至 Google Sheet');}catch(e){console.error(e);setSyncStatus('同步失敗：'+(e.result?.error?.message||e.message));toast('Google Sheet 同步失敗');}
}
async function syncFromSheet(){
  if(!currentEmail||!accessToken){toast('請先登入 Google');return;}
  try{setSyncStatus('取得資料中…');const title=await ensureSheetTab();const r=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:CONFIG.SPREADSHEET_ID,range:`'${title}'!A:I`});const vals=r.result.values||[];if(vals.length<=1){save();setSyncStatus('Google Sheet 尚無資料');toast('目前沒有雲端資料');return;}const stateRow=vals.find(row=>row[0]==='STATE');if(stateRow&&stateRow[7]){db=JSON.parse(stateRow[7]);db.categories=(db.categories||[]).map(x=>({...x,active:x.active!==false}));db.monthlyBudgets=db.monthlyBudgets||{};month=db.month||month;save();render();}else{db.transactions=vals.slice(1).filter(r=>r[0]==='TRANSACTION').map(r=>({id:r[1],date:r[2],amount:Number(r[3]),cat:r[4],payment:r[5],note:r[6]||''}));save();render();}setSyncStatus('最後同步：'+new Date().toLocaleString('zh-TW'));toast('已從 Google Sheet 取得資料');}catch(e){console.error(e);setSyncStatus('取得失敗：'+(e.result?.error?.message||e.message));toast('Google Sheet 取得失敗');}
}
function ensureMonth(m){if(!db.monthlyBudgets[m])db.monthlyBudgets[m]={income:db.income||60000,savingRate:db.savingRate??.25,budgets:{}};cats().forEach(c=>{if(db.monthlyBudgets[m].budgets[c.id]===undefined)db.monthlyBudgets[m].budgets[c.id]=c.budget});return db.monthlyBudgets[m]}
function save(){db.month=month;localStorage.setItem(KEY,JSON.stringify(db))}function allCats(){return db.categories||[]}function cats(){return allCats().filter(x=>x.active!==false)}function cat(id){return allCats().find(x=>x.id===id)||{name:'其他',emoji:'📦',budget:0,type:'variable'}}function pay(id){return (db.payments||paymentDefaults).find(x=>x.id===id)||{name:'付款',emoji:'💳'}}function txMonth(){return db.transactions.filter(x=>x.date.slice(0,7)===month)}function spent(id){return txMonth().filter(x=>x.cat===id).reduce((a,x)=>a+x.amount,0)}function totalSpent(){return txMonth().reduce((a,x)=>a+x.amount,0)}function isCreditPayment(x){let p=pay(x.payment);return x.payment==='credit'||p.type==='credit'||p.name==='信用卡'}function creditThisMonth(){return txMonth().filter(isCreditPayment).reduce((a,x)=>a+x.amount,0)}function creditDetails(m=month){return db.transactions.filter(x=>x.date.slice(0,7)===m&&isCreditPayment(x)).slice().sort((a,b)=>a.date.localeCompare(b.date))}function creditNext(){return db.transactions.filter(x=>isCreditPayment(x)&&nextMonth(x.date.slice(0,7))===month).reduce((a,x)=>a+x.amount,0)}function budgetOf(id,m=month){let mm=ensureMonth(m);return mm.budgets[id]??cat(id).budget}function planned(m=month){return cats().reduce((a,x)=>a+budgetOf(x.id,m),0)}function savingsTarget(m=month){return ensureMonth(m).income*ensureMonth(m).savingRate}function available(m=month){return ensureMonth(m).income-savingsTarget(m)-planned(m)}function fmtDate(d){return d.slice(5).replace('-','/')}
function render(){document.getElementById('monthTitle').textContent=monthName(month);renderBudget();renderOverview();renderCalendar();renderReports();renderSettings()}
function budgetRow(x){let b=budgetOf(x.id),s=spent(x.id),p=b?Math.min(100,s/b*100):0;return `<div class="row"><div style="flex:1"><div class="left"><div class="ico">${x.emoji}</div><div><div class="name">${x.name}</div><div class="small">預算 ${money(b)} · 已支出 ${money(s)}</div></div></div><div class="progress"><div class="bar" style="width:${p}%"></div></div></div><div class="money">${money(Math.max(0,b-s))}</div></div>`}
function renderBudget(){let fixed=cats().filter(x=>x.type==='fixed'),variable=cats().filter(x=>x.type==='variable'),cc=creditThisMonth(),over=totalSpent()-planned();document.getElementById('budget').innerHTML=`<div class="card hero"><div class="eyebrow">${monthName(month)} 可規劃收入</div><div class="big">${money(ensureMonth(month).income)}</div><div class="stats"><div class="stat"><span class="eyebrow">預計儲蓄</span><b>${money(savingsTarget())}</b></div><div class="stat"><span class="eyebrow">預算總額</span><b>${money(planned())}</b></div><div class="stat"><span class="eyebrow">目前支出</span><b>${money(totalSpent())}</b></div></div></div><div class="card ${cc>0?'warn':'info'}"><div class="row" style="padding-top:0"><div><b>本期信用卡金額</b><div class="small">本月刷卡已計入本月支出</div></div><div class="big" style="font-size:28px;margin:0">${money(cc)}</div></div>${creditDetails().length?`<div style="margin-top:10px">${creditDetails().map(x=>`<div class="row" onclick="editTx(${x.id})"><div><div class="name">${cat(x.cat).emoji} ${cat(x.cat).name}</div><div class="small">${fmtDate(x.date)} · ${x.note||'信用卡消費'}</div></div><div class="money">${money(x.amount)}</div></div>`).join('')}</div>`:'<div class="small">本期尚無信用卡消費</div>'}<div class="small" style="margin-top:10px">下期信用卡預算預留：${money(creditNext())}</div></div><div class="section"><span>預算設定</span><div style="display:flex;gap:8px"><button class="btn secondary" onclick="editBudget('${month}')">調整本月</button><button class="btn secondary" onclick="editBudget(nextMonth(month))">設定下月</button></div></div><div class="card"><div class="row"><div><b>${monthName(month)} 預算</b><div class="small">可在月底先設定下一個月的預算</div></div><div class="money">${money(planned())}</div></div><div class="row"><span>本期預算使用（含信用卡）</span><b>${money(totalSpent())}</b></div><div class="row"><span>${over>0?'目前超支':'目前預算餘額'}</span><b class="${over>0?'danger':''}">${money(Math.abs(over))}</b></div></div><div class="section"><span>固定支出</span><span class="pill">${money(fixed.reduce((a,x)=>a+budgetOf(x.id),0))}</span></div><div class="card">${fixed.map(budgetRow).join('')}</div><div class="section"><span>變動項目</span><button class="btn secondary" onclick="editCategories()">管理項目</button></div><div class="card">${variable.map(budgetRow).join('')}</div><div class="card"><div class="row" style="padding-top:0"><div><b>餐飲預算</b><div class="small">餐費＋食材，每月固定控制在 NT$8,000</div></div><div class="money">${money(budgetOf('food')+budgetOf('grocery'))}</div></div><div class="small">餐費 NT$7,000 · 食材 NT$1,000；不再限制每日餐費，改以月預算管理。</div></div><div class="card info"><b>信用卡規則</b><div class="small" style="margin-top:5px">本月刷卡會算在本月支出；每筆刷卡明細會保留日期與項目，並自動成為下一期信用卡預算。</div></div>`}
function renderOverview(){let spend=totalSpent(),saving=ensureMonth(month).income-spend,budget=planned(),ratio=budget?spend/budget:0;let rows=txMonth().slice().sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('overview').innerHTML=`<div class="card hero"><div class="eyebrow">${monthName(month)} 本期已支出</div><div class="big">${money(spend)}</div><div class="stats"><div class="stat"><span class="eyebrow">預算金額</span><b>${money(budget)}</b></div><div class="stat"><span class="eyebrow">已支出金額</span><b>${money(spend)}</b></div><div class="stat"><span class="eyebrow">本期儲蓄</span><b>${money(saving)}</b></div></div></div><div class="card"><div class="eyebrow">本期儲蓄金額</div><div class="big">${money(saving)}</div><div class="progress"><div class="bar" style="width:${Math.min(100,ensureMonth(month).income?saving/ensureMonth(month).income*100:0)}%"></div></div></div><div class="section"><span>本月支出</span><span class="pill">${rows.length} 筆</span></div><div class="card">${rows.map(x=>`<div class="row listitem" onclick="editTx(${x.id})"><div class="left"><div class="ico">${cat(x.cat).emoji}</div><div><div class="name">${cat(x.cat).name}</div><div class="small">${fmtDate(x.date)} · ${pay(x.payment).emoji} ${pay(x.payment).name}${x.note?' · '+x.note:''}</div></div></div><div class="money">${money(x.amount)}</div></div>`).join('')||'<div class="empty">還沒有記帳</div>'}</div><div class="card warn"><b>下月信用卡預算預留</b><div class="big">${money(creditNext())}</div><div class="small">本期刷卡會計入本期支出，不會重複扣除。</div></div><div class="section"><span>本期信用卡明細</span><span class="pill">${money(creditThisMonth())}</span></div><div class="card">${creditDetails().map(x=>`<div class="row listitem" onclick="editTx(${x.id})"><div><div class="name">${cat(x.cat).emoji} ${cat(x.cat).name}</div><div class="small">${fmtDate(x.date)} · ${x.note||'信用卡消費'}</div></div><div class="money">${money(x.amount)}</div></div>`).join('')||'<div class="empty">本期沒有信用卡消費</div>'}</div>`}
function renderCalendar(){let d=new Date(month+'-01T00:00:00'),first=d.getDay(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();let cells='';for(let i=0;i<first;i++)cells+='<div class="day blank"></div>';for(let n=1;n<=days;n++){let ds=month+'-'+String(n).padStart(2,'0'),sp=db.transactions.filter(x=>x.date===ds).reduce((a,x)=>a+x.amount,0);cells+=`<div class="day" onclick="openDay('${ds}')"><div class="daynum">${n}</div>${sp?`<div class="dayspend">-${money(sp).replace('NT$ ','')}</div>`:''}</div>`}document.getElementById('calendar').innerHTML=`<div class="section"><span>日曆</span></div><div class="calendar"><div class="dow">${['日','一','二','三','四','五','六'].map(x=>`<div>${x}</div>`).join('')}</div><div class="days">${cells}</div></div><div id="dayDetail"></div>`}
function openDay(ds){let rows=db.transactions.filter(x=>x.date===ds);document.getElementById('dayDetail').innerHTML=`<div class="section"><span>${ds.replaceAll('-','/')} 記帳</span><button class="btn primary" onclick="openAdd('${ds}')">＋ 記一筆</button></div><div class="card">${rows.map(x=>`<div class="row listitem" onclick="editTx(${x.id})"><div class="left"><div class="ico">${cat(x.cat).emoji}</div><div><div class="name">${cat(x.cat).name}</div><div class="small">${pay(x.payment).emoji} ${pay(x.payment).name}${x.note?' · '+x.note:''}</div></div></div><div class="money">${money(x.amount)}</div></div>`).join('')||'<div class="empty">這天沒有記帳</div>'}</div>`}
function renderReports(){let arr=cats().map(x=>({x,s:spent(x.id)})).filter(a=>a.s>0).sort((a,b)=>b.s-a.s);let daysInMonth=new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate();let daily=Array.from({length:daysInMonth},(_,i)=>{let day=i+1;return db.transactions.filter(x=>x.date.slice(0,7)===month&&Number(x.date.slice(8))===day).reduce((a,x)=>a+x.amount,0)});let max=Math.max(1,...daily);let labelDays=new Set([1,5,10,15,20,25,daysInMonth]);document.getElementById('reports').innerHTML=`<div class="section"><span>報表</span></div><div class="card"><div class="section" style="margin:0 0 5px"><span>本月支出趨勢</span><span class="pill">${money(totalSpent())}</span></div><div class="reportbars" style="gap:3px">${daily.map((s,i)=>{let day=i+1;return `<div class="reportbar" style="min-width:0"><i style="height:${s?Math.max(5,s/max*120):2}px;opacity:${s?1:.18}"></i><span>${labelDays.has(day)?day+'日':''}</span></div>`}).join('')}</div></div><div class="section"><span>分類支出</span></div><div class="card">${arr.map(a=>`<div class="row"><div class="left"><div class="ico">${a.x.emoji}</div><div><div class="name">${a.x.name}</div><div class="small">占本月支出 ${totalSpent()?Math.round(a.s/totalSpent()*100):0}%</div></div></div><div class="money">${money(a.s)}</div></div>`).join('')||'<div class="empty">目前沒有支出資料</div>'}</div><div class="card info"><b>信用卡報表口徑</b><div class="small" style="margin-top:5px">刷卡發生當月算本月支出；該筆刷卡金額會自動成為下一個月的信用卡待付預算。</div></div>`}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="section"><span>帳本設定</span></div><div class="card"><div class="authUser"><div><b>Google 帳號</b><div id="signedEmail" class="small">尚未登入</div></div><button class="btn secondary" onclick="signOutApp()">登出</button></div><div class="setting"><div><b>Google Sheet 同步</b><div id="syncStatus" class="syncStatus">尚未同步</div></div><span class="tag taggreen">已連線</span></div><div class="syncButtons"><button class="btn secondary" onclick="syncFromSheet()">↓ 從 Google Sheet 取得</button><button class="btn primary" onclick="syncToSheet()">↑ 同步至 Google Sheet</button></div><div class="small" style="margin-top:10px">你的資料會寫入自己的帳本分頁，不會讀取另一位使用者的帳務。</div><div class="setting"><div><b>帳本起算</b><div class="small">每月 1 日 ～ 月底</div></div><span class="pill">固定</span></div><div class="setting"><div><b>發薪日</b><div class="small">只影響收入入帳，不影響統計週期</div></div><span class="pill">5 日</span></div></div><div class="section"><span>分類與付款方式</span></div><div class="card"><button class="btn secondary full" onclick="editCategories()">編輯支出項目</button><button class="btn secondary full" style="margin-top:8px" onclick="editPayments()">編輯付款方式</button></div>`}
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render()}
function openSettings(){showView('settings')}function moveMonth(n){let[y,m]=month.split('-').map(Number);m+=n;if(m===0){y--;m=12}if(m===13){y++;m=1}month=y+'-'+String(m).padStart(2,'0');ensureMonth(month);save();render()}
function openAdd(date){editTxId=null;let d=date||month+'-01';document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>記一筆</h2><label>日期</label><input id="fdate" type="date" value="${d}"><label>金額</label><input id="famount" type="number" inputmode="decimal" placeholder="0"><label>支出項目</label><select id="fcat">${cats().map(x=>`<option value="${x.id}">${x.emoji} ${x.name}</option>`).join('')}</select><label>付款方式</label><select id="fpay">${(db.payments||paymentDefaults).map(x=>`<option value="${x.id}">${x.emoji} ${x.name}</option>`).join('')}</select><label>備註</label><input id="fnote" placeholder="選填"><div class="actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveTx()">儲存</button></div>`;openModal()}
let editTxId=null;function editTx(id){editTxId=id;let x=db.transactions.find(t=>t.id===id);if(!x)return;document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>修改支出</h2><label>日期</label><input id="fdate" type="date" value="${x.date}"><label>金額</label><input id="famount" type="number" value="${x.amount}"><label>支出項目</label><select id="fcat">${cats().map(c=>`<option value="${c.id}" ${c.id===x.cat?'selected':''}>${c.emoji} ${c.name}</option>`).join('')}</select><label>付款方式</label><select id="fpay">${(db.payments||paymentDefaults).map(p=>`<option value="${p.id}" ${p.id===x.payment?'selected':''}>${p.emoji} ${p.name}</option>`).join('')}</select><label>備註</label><input id="fnote" value="${x.note||''}"><div class="actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveTx()">儲存修改</button></div><button class="btn full danger" style="margin-top:10px" onclick="deleteTx(${id})">刪除這筆支出</button>`;openModal()}
function saveTx(){let o={id:editTxId||Date.now(),date:document.getElementById('fdate').value,amount:Number(document.getElementById('famount').value),cat:document.getElementById('fcat').value,payment:document.getElementById('fpay').value,note:document.getElementById('fnote').value.trim()};if(!o.date||!o.amount){toast('請填寫日期與金額');return}if(editTxId)db.transactions=db.transactions.map(x=>x.id===editTxId?o:x);else db.transactions.push(o);save();closeModal();render();toast(editTxId?'已修改支出':'已新增支出');editTxId=null}
function deleteTx(id){db.transactions=db.transactions.filter(x=>x.id!==id);save();closeModal();render();toast('已刪除支出')}
function editBudget(target=month){ensureMonth(target);let m=ensureMonth(target);document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>${monthName(target)} 預算</h2><label>月收入</label><input id="income" type="number" value="${m.income}"><label>預計儲蓄比例 (%)</label><input id="rate" type="number" min="0" max="100" value="${Math.round(m.savingRate*100)}"><div class="small" style="margin-top:8px">可在 ${monthName(month)} 月底先調整 ${monthName(target)} 的預算。</div><div id="budgetEditor">${cats().map(c=>`<div class="two"><div><label>${c.emoji} ${c.name}</label><input class="mbudget" data-id="${c.id}" type="number" value="${budgetOf(c.id,target)}"></div><div></div></div>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveBudget('${target}')">儲存</button></div>`;openModal()}
function saveBudget(target){let m=ensureMonth(target);m.income=Number(document.getElementById('income').value)||0;m.savingRate=Math.max(0,Math.min(1,Number(document.getElementById('rate').value)/100));document.querySelectorAll('.mbudget').forEach(i=>m.budgets[i.dataset.id]=Number(i.value)||0);save();closeModal();render();toast(`${monthName(target)} 預算已更新`)}
function editCategories(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>支出項目</h2><div id="catEditor">${cats().map(catEditorRow).join('')}</div><button class="btn secondary full" style="margin-top:10px" onclick="addCatRow()">＋ 新增項目</button><button class="btn primary full" style="margin-top:10px" onclick="saveCats()">儲存項目</button>`;openModal()}
function catEditorRow(x){return `<div class="row catrow" data-id="${x.id}" style="display:block"><div class="two"><div><label>名稱</label><input class="cname" value="${x.name}"></div><div><label>預算</label><input class="cbudget" type="number" value="${x.budget}"></div></div><div class="two"><div><label>類型</label><select class="ctype"><option value="fixed" ${x.type==='fixed'?'selected':''}>固定支出</option><option value="variable" ${x.type==='variable'?'selected':''}>變動項目</option></select></div><div><label>圖示</label><input class="cemoji" value="${x.emoji}"></div></div><button type="button" class="btn danger full" style="margin-top:8px" onclick="removeCatRow(this)">刪除這個支出項目</button></div>`}function removeCatRow(btn){btn.closest('.catrow').remove()}function addCatRow(){let id='new'+Date.now();document.getElementById('catEditor').insertAdjacentHTML('beforeend',catEditorRow({id,name:'新項目',emoji:'📦',type:'variable',budget:0}))}function saveCats(){let rows=[...document.querySelectorAll('.catrow')];let kept=rows.map(r=>({id:r.dataset.id,name:r.querySelector('.cname').value.trim()||'未命名',budget:Number(r.querySelector('.cbudget').value)||0,type:r.querySelector('.ctype').value,emoji:r.querySelector('.cemoji').value||'📦',active:true}));let keptIds=new Set(kept.map(x=>x.id));let hidden=allCats().filter(x=>!keptIds.has(x.id)).map(x=>({...x,active:false}));db.categories=[...hidden,...kept];Object.keys(db.monthlyBudgets).forEach(m=>cats().forEach(c=>{if(db.monthlyBudgets[m].budgets[c.id]===undefined)db.monthlyBudgets[m].budgets[c.id]=c.budget}));save();closeModal();render();toast('支出項目已更新')}
function editPayments(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>付款方式</h2><div id="payEditor">${(db.payments||paymentDefaults).map(x=>`<div class="row payrow" data-id="${x.id}"><div class="two" style="width:100%"><div><label>名稱</label><input class="pname" value="${x.name}"></div><div><label>圖示</label><input class="pemoji" value="${x.emoji}"></div></div></div>`).join('')}</div><button class="btn secondary full" style="margin-top:10px" onclick="addPayRow()">＋ 新增付款方式</button><button class="btn primary full" style="margin-top:10px" onclick="savePays()">儲存付款方式</button>`;openModal()}
function addPayRow(){document.getElementById('payEditor').insertAdjacentHTML('beforeend',`<div class="row payrow" data-id="new${Date.now()}"><div class="two" style="width:100%"><div><label>名稱</label><input class="pname" value="新付款方式"></div><div><label>圖示</label><input class="pemoji" value="💳"></div></div></div>`)}function savePays(){db.payments=[...document.querySelectorAll('.payrow')].map(r=>({id:r.dataset.id,name:r.querySelector('.pname').value.trim()||'未命名',emoji:r.querySelector('.pemoji').value||'💳'}));save();closeModal();render();toast('付款方式已更新')}
function openModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
document.getElementById('authGate').style.display='flex';
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
</body></html>
